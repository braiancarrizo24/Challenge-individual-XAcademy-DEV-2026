
<main class="login-page">
  <section class="login-card">
    <a routerLink="/" class="login-brand">
      <span>FIFA</span> Stats
    </a>

    <div class="login-heading">
      <span class="login-eyebrow">PANEL DE ADMINISTRACIÓN</span>
      <h1>Bienvenido</h1>
      <p>Iniciá sesión para administrar los datos de FIFA Stats.</p>
    </div>

    <form class="login-form" (ngSubmit)="login()">
      <label class="form-field">
        <span>Correo electrónico</span>
        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="admin@fifastats.local"
          autocomplete="username"
          required
        />
      </label>

      <label class="form-field">
        <span>Contraseña</span>
        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Ingresá tu contraseña"
          autocomplete="current-password"
          required
        />
      </label>

      <div class="login-error" *ngIf="error">
        {{ error }}
      </div>

      <button
        type="submit"
        class="login-button"
        [disabled]="loading"
      >
        {{ loading ? 'Ingresando...' : 'Iniciar sesión' }}
      </button>
    </form>

    <a routerLink="/" class="back-link">
      Volver al inicio
    </a>
  </section>
</main>
